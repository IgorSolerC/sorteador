<!-- A cena reencena um resultado já decidido; nenhum pixel participa do sorteio. -->
<button type="button" class="machine-replay" [disabled]="busy()" (click)="askReplay()"
  [attr.aria-label]="busy() ? 'A máquina está entregando' : 'Girar a roleta de novo, só a animação'">
  <svg class="machine-front" viewBox="-26 -26 452 576" aria-hidden="true">
    <defs>
      <!-- Um atlas mantém a mesma luz no aro, vidro e esmalte. Os recortes registram
           as peças do render; os nomes e as cores continuam sendo dados do grupo. -->
      <image id="material-maquina" href="images/maquina-materiais.png" width="1177" height="1337" />
      <image id="material-capsula" href="images/capsula-material.png" width="1254" height="1254" />
      <clipPath id="silhueta-roda"><circle cx="589" cy="470" r="459" /></clipPath>
      <clipPath id="silhueta-caixa">
        <path d="M94 899Q94 872 112 847L145 810Q161 795 181 795H994Q1018 795 1037 817L1073 857Q1087 879 1087 903V1217Q1087 1267 1036 1267H145Q94 1267 94 1217Z" />
      </clipPath>
      <clipPath id="silhueta-capsula"><circle cx="623" cy="597" r="496" /></clipPath>
      <clipPath id="core-clip"><circle cx="200" cy="200" r="96" /></clipPath>
      <clipPath id="recorte-calha"><path d="M505 834H674L644 932H537Z" /></clipPath>
      <clipPath id="meia-capsula-cima"><path d="M258 458a22 22 0 0 1 44 0Z" /></clipPath>
      <clipPath id="meia-capsula-baixo"><path d="M258 458h44a22 22 0 0 1-44 0Z" /></clipPath>
      <symbol id="capsula-fisica" viewBox="127 101 992 992">
        <g clip-path="url(#silhueta-capsula)"><use href="#material-capsula" /></g>
      </symbol>
      <symbol id="roda-fisica" viewBox="130 11 918 918">
        <g clip-path="url(#silhueta-roda)"><use href="#material-maquina" /></g>
      </symbol>
      <!-- A faixa dos nomes conserva a cor original: a sombra óptica só ocupa as bordas. -->
      <mask id="verniz-fora-nomes" maskUnits="userSpaceOnUse" x="30" y="30" width="340" height="340">
        <circle cx="200" cy="200" r="168" fill="white" />
        <circle cx="200" cy="200" r="153" fill="black" />
        <circle cx="200" cy="200" r="128" fill="white" />
        <circle cx="200" cy="200" r="118" fill="black" />
      </mask>
      <linearGradient id="casca-acrilico" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="var(--chrome-dim)" stop-opacity=".3" />
        <stop offset="1" stop-color="var(--enamel)" stop-opacity=".15" />
      </linearGradient>
      <radialGradient id="volume-capsula" cx=".28" cy=".2" r=".9">
        <stop offset="0" stop-color="var(--white)" stop-opacity=".65" />
        <stop offset=".4" stop-color="var(--white)" stop-opacity="0" />
        <stop offset="1" stop-color="var(--sombra-maquina)" stop-opacity=".6" />
      </radialGradient>
      <linearGradient id="metal-braco" x1="0" y1="0" x2="1" y2=".5">
        <stop offset="0" stop-color="var(--enamel-deep)" />
        <stop offset=".45" stop-color="var(--chrome-dim)" />
        <stop offset=".65" stop-color="var(--enamel-raised)" />
        <stop offset="1" stop-color="var(--enamel-deep)" />
      </linearGradient>
      <radialGradient id="sombra-assento">
        <stop offset="0" stop-color="var(--sombra-maquina)" stop-opacity=".9" />
        <stop offset=".55" stop-color="var(--sombra-maquina)" stop-opacity=".55" />
        <stop offset="1" stop-color="var(--sombra-maquina)" stop-opacity="0" />
      </radialGradient>
      <filter id="sombra-globo" filterUnits="userSpaceOnUse" x="-94" y="-72" width="588" height="588" color-interpolation-filters="sRGB">
        <feDropShadow dx="0" dy="22" stdDeviation="40" flood-color="var(--enamel-deep)" flood-opacity=".55" />
      </filter>
      <filter id="sombra-corpo" filterUnits="userSpaceOnUse" x="-70" y="260" width="550" height="330" color-interpolation-filters="sRGB">
        <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="var(--sombra-maquina)" flood-opacity=".45" />
      </filter>
      <filter id="sombra-braco" filterUnits="userSpaceOnUse" x="30" y="370" width="170" height="165" color-interpolation-filters="sRGB">
        <feDropShadow dx="1.5" dy="4" stdDeviation="3.5" flood-color="var(--sombra-maquina)" flood-opacity=".45" />
      </filter>
    </defs>

    <ellipse cx="200" cy="523" rx="207" ry="22" fill="url(#sombra-assento)" />
    <g class="body-plate">
      <svg x="14" y="332" width="372" height="184" viewBox="94 795 993 472" preserveAspectRatio="none">
        <g clip-path="url(#silhueta-caixa)"><use href="#material-maquina" /></g>
      </svg>
    </g>
    <g class="decals">
      <path class="leader" d="M44 40 44 74 96 116" />
      <text class="decal" x="8" y="30">{{ capsules().length }} {{ chosenIndex() >= 0 ? 'NO GIRO' : 'CÁPSULAS' }}</text>
      <path class="leader leader-plate" d="M96 378h69" />
      <text class="decal decal-plate" x="88" y="381" text-anchor="end">CALHA</text>
      <text class="decal decal-plate" x="281" y="406" text-anchor="middle">BANDEJA</text>
    </g>

    <circle class="globe-well" cx="200" cy="200" r="170" fill="var(--enamel-deep)" />
    <use class="globe-rim" href="#roda-fisica" x="15" y="15" width="370" height="370" />
    <g clip-path="url(#core-clip)">
      <g class="loose">
        @for (loose of looseCapsules(); track $index) {
          <g [attr.transform]="loose.transform" class="capsula-solta-fisica">
            <use href="#capsula-fisica" [attr.x]="loose.cx - 15" [attr.y]="loose.cy - 15" width="30" height="30" />
            <path class="loose-dome" [attr.d]="loose.dome" [attr.fill]="loose.color" />
            <path class="loose-spot" [attr.d]="loose.spot" />
          </g>
        }
      </g>
    </g>
    <g class="capsule-field" [style.transform]="'rotate(' + rotation() + 'deg)'">
      @for (capsule of capsules(); track trackCapsule($index, capsule); let index = $index) {
        <g class="capsule" [class.is-chosen]="revealed() && index === chosenIndex()">
          <path class="capsule-dome" [attr.d]="capsule.dome" [attr.fill]="capsule.color" />
          <path class="capsule-shell" [attr.d]="capsule.clear" />
          <path [attr.id]="'rim-' + index" [attr.d]="capsule.labelPath" fill="none" />
          <text class="capsule-name" [attr.font-size]="capsule.fontSize" [style.fill]="capsule.ink">
            <textPath [attr.href]="'#rim-' + index" startOffset="50%" text-anchor="middle">{{ capsule.label }}</textPath>
          </text>
        </g>
      }
    </g>
    <g class="verniz-fisico" mask="url(#verniz-fora-nomes)" pointer-events="none">
      <use href="#roda-fisica" x="15" y="15" width="370" height="370" />
    </g>
    <circle class="hub-pin" cx="200" cy="202" r="9.5" />
    <circle cx="200" cy="202" r="9.5" fill="url(#volume-capsula)" />

    <svg class="chute" x="170" y="358" width="60" height="35" viewBox="505 834 169 98">
      <g clip-path="url(#recorte-calha)"><use href="#material-maquina" /></g>
    </svg>
    <path class="chute-lip" d="M173 359h54" />

    <!-- O disco escovado já está no atlas. Somente o braço gira; o filtro de luz
         fica no pai parado para a sombra nunca trocar de direção com a manivela. -->
    <g class="crank">
      <g class="luz-manivela" filter="url(#sombra-braco)">
        <g class="crank-arm">
          <path class="crank-bar" d="M111 444l25-25" />
          <path d="M110 442l24-24" fill="none" stroke="url(#metal-braco)" stroke-width="5" stroke-linecap="round" />
          <circle class="crank-knob" cx="138" cy="417" r="10" />
          <circle cx="138" cy="417" r="7.5" fill="var(--live)" />
          <circle cx="138" cy="417" r="7.5" fill="url(#volume-capsula)" />
        </g>
      </g>
      <circle class="crank-boss" cx="111" cy="444" r="7.5" />
    </g>

    <g class="delivery">
      <g class="delivery-body">
        <g class="delivery-dome">
          <g clip-path="url(#meia-capsula-cima)">
            <use href="#capsula-fisica" x="258" y="436" width="44" height="44" />
            <path class="tampa-colorida" d="M258 458a22 22 0 0 1 44 0Z" [attr.fill]="winnerColor()" />
          </g>
        </g>
        <g class="delivery-shell" clip-path="url(#meia-capsula-baixo)">
          <use href="#capsula-fisica" x="258" y="436" width="44" height="44" />
          @if (winner()?.emoji; as emoji) {
            <text class="delivery-emoji" x="280" y="470" text-anchor="middle">{{ emoji }}</text>
          }
        </g>
      </g>
    </g>
  </svg>
  <span class="visually-hidden">Globo com {{ capsules().length }} cápsulas, uma por participante.</span>
</button>
@if (caption()) { <p class="machine-caption">{{ caption() }}</p> }
